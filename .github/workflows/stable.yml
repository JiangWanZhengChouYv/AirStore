name: Stable AirStore build

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# Without this the job's token is read-only and the last step dies with
# "HTTP 403: Resource not accessible by integration" -- develop.yml has had this
# permission since the first run and creates its release fine.
permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AirStore - stable
    runs-on: macos-26

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANNEL: stable
      UPSTREAM_CHANNEL: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Find Last Successful commit
        run: |
          LAST_SUCCESSFUL_COMMIT=$(python3 scripts/ci/workflow.py last-successful-commit \
            "true" || echo "")
          echo "LAST_SUCCESSFUL_COMMIT=$LAST_SUCCESSFUL_COMMIT" | tee -a $GITHUB_ENV

      - run: brew install ldid xcbeautify

      - name: Setup Env
        run: |
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)

          if [ "$MARKETING_VERSION" != "${{ github.ref_name }}" ]; then
            echo "Version mismatch"
            echo "Build.xcconfig: $MARKETING_VERSION"
            echo "Tag: ${{ github.ref_name }}"
            exit 1
          fi

          echo "MARKETING_VERSION=$MARKETING_VERSION" | tee -a $GITHUB_ENV
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a $GITHUB_ENV

      - name: Check the toolchain
        run: |
          # A macos-26 runner already boots with the 26.4 toolchain selected; the setup action this
          # replaced occasionally stalls for minutes on a network lookup.
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "$major" -lt 26 ]; then
            echo "::error::the runner's default Xcode is $(xcodebuild -version | head -1); this build needs the 26 SDK"
            exit 1
          fi

      - name: Restore Cache (exact)
        id: xcode-cache-exact
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-stable-${{ github.sha }}

      - name: Restore Cache (last)
        if: steps.xcode-cache-exact.outputs.cache-hit != 'true'
        id: xcode-cache-fallback
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-stable-

      - name: Build
        id: build
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          python3 scripts/ci/workflow.py build; STATUS=$?
          python3 scripts/ci/workflow.py encrypt-build
          exit $STATUS

      - name: Save Cache
        if: ${{ steps.xcode-cache-fallback.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-stable-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.MARKETING_VERSION }}.zip
          path: build-logs.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AirStore-${{ env.MARKETING_VERSION }}.ipa
          path: AirStore.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AirStore-${{ env.MARKETING_VERSION }}-dSYMs.zip
          path: AirStore.dSYMs.zip

      - name: Generate Metadata
        run: |
          python3 scripts/ci/workflow.py dump-project-settings
          BUNDLE_ID=$(python3 scripts/ci/workflow.py read-bundle-id)
          IPA_NAME="AirStore.ipa"

          python3 scripts/ci/workflow.py generate-metadata \
            "${{ github.ref_name }}" \
            "$SHORT_COMMIT" \
            "$MARKETING_VERSION" \
            "$CHANNEL" \
            "$BUNDLE_ID" \
            "$IPA_NAME" \
            "$LAST_SUCCESSFUL_COMMIT"

      - name: Upload to releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/workflow.py upload-release \
            "AirStore ${{ github.ref_name }}" \
            "${{ github.ref_name }}" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "$UPSTREAM_CHANNEL" \
            "true"

  # Its own job, listed after the build the way Pages' deployment follows a push: a release that
  # died on the Mac runner still has to say so, and a two-second curl does not need one.
  notify:
    name: Tell Discord how the release went
    needs: build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Post the result
        env:
          # Releases go to the announcement channel when that webhook exists, and fall back to the CI
          # channel when it does not -- a missing secret must not silence a release notice entirely.
          WEBHOOK_ANNOUNCE: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCE }}
          WEBHOOK_CI: ${{ secrets.DISCORD_WEBHOOK_AIRSTORE }}
          STATUS: ${{ needs.build.result }}
          # For a stable build the tag is the version, so nothing has to cross over from the build job.
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No webhook configured means silent, and a webhook that does not answer must never turn a
          # published release red.
          WEBHOOK="${WEBHOOK_ANNOUNCE:-$WEBHOOK_CI}"
          if [ -z "$WEBHOOK" ]; then echo "no DISCORD_WEBHOOK_ANNOUNCE or DISCORD_WEBHOOK_AIRSTORE secret -- nothing to tell"; exit 0; fi
          if [ -n "$WEBHOOK_ANNOUNCE" ]; then echo "posting to the announcement channel"; else echo "DISCORD_WEBHOOK_ANNOUNCE is not set, falling back to the ci channel"; fi
          # Bilingual, same as the develop channel's notice.
          case "$STATUS" in
            success)   colour=5763719;  word="released / 已发布" ;;
            cancelled) colour=16763904; word="cancelled / 发布被取消" ;;
            *)         colour=15158332; word="failed / 发布失败" ;;
          esac
          # What changed since the previous stable, newest first. The previous stable is the newest
          # published release that is not this tag -- the build job has already published this one, so
          # "latest" would be the release being announced.
          PREV=$(gh api "repos/$REPO/releases?per_page=30" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null | grep -v "^${VERSION}$" | head -1 || true)
          if [ -n "$PREV" ]; then
            COMMITS=$(gh api "repos/$REPO/compare/$PREV...$VERSION" --jq '[.commits[] | .commit.message | split("\n")[0]] | reverse | .[]' 2>/dev/null || true)
          else
            COMMITS=$(gh api "repos/$REPO/commits?sha=$VERSION&per_page=10" --jq '.[].commit.message | split("\n")[0]' 2>/dev/null || true)
          fi
          export COMMITS PREV
          payload=$(python3 - "$word" "$colour" <<'PY'
          import json, os, sys

          word, colour = sys.argv[1], int(sys.argv[2])
          version = os.environ.get("VERSION", "")
          previous = os.environ.get("PREV", "")
          subjects = [line.strip() for line in (os.environ.get("COMMITS") or "").splitlines() if line.strip()]

          lines = [version]
          if subjects:
              lines.append("Changes since %s / 自 %s 以来的改动" % (previous or "the last release", previous or "the last release"))
              lines.extend("- " + subject.replace("`", "'") for subject in subjects[:10])
              if len(subjects) > 10:
                  lines.append("剩余 %d 个提交未展示 / %d more commits not shown" % (len(subjects) - 10, len(subjects) - 10))
          lines.append("[downloads / 下载页](%s) · [build log / 构建日志](%s)"
                       % (os.environ.get("RELEASE_URL", ""), os.environ.get("RUN_URL", "")))

          print(json.dumps({"embeds": [{
              "title": "AirStore %s %s" % (word, version),
              "description": "\n".join(lines),
              "color": colour,
          }]}))
          PY
          )
          curl -fsS -m 20 -H 'content-type: application/json' -X POST "$WEBHOOK" -d "$payload" >/dev/null \
            || echo "::warning::the Discord webhook did not answer"
