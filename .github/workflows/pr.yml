name: Pull Request AirStore build

on:
  pull_request:
    # types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitmodules'
      - '.github/**'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload SideStore
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1    # shallow clone just for PR

      - run: brew install ldid xcbeautify

      - name: Setup Env
        run: |
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(git rev-parse --short ${{ github.event.pull_request.head.sha }})
          NORMALIZED_VERSION="${MARKETING_VERSION}-pr.${{ github.event.pull_request.number }}+${SHORT_COMMIT}"
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a $GITHUB_ENV
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a $GITHUB_ENV

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"

      # Same correction as the develop pipeline: restoring a gigabyte of DerivedData never skipped a
      # compile, because Xcode's incremental state keys off input mtimes and a PR checkout rewrites
      # them. Only the package checkouts are worth carrying, and a PR runs on top of develop often
      # enough to reuse the develop cache through the prefix. Nothing is saved here -- a PR is a
      # one-off and should not spend the repository's 10 GB budget on it.
      - name: Restore the package checkouts
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-pr-${{ hashFiles('**/Package.resolved', 'Build.xcconfig') }}
          restore-keys: |
            xcode-develop-airstore-
            xcode-pr-

      - name: Build
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          python3 scripts/ci/workflow.py build; STATUS=$?
          python3 scripts/ci/workflow.py encrypt-build
          mv AirStore.ipa AirStore-${{ env.MARKETING_VERSION }}.ipa
          exit $STATUS

      - uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.MARKETING_VERSION }}.zip
          path: build-logs.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ env.MARKETING_VERSION }}.ipa
          path: SideStore-${{ env.MARKETING_VERSION }}.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AirStore-${{ env.MARKETING_VERSION }}-dSYMs.zip
          path: AirStore.dSYMs.zip
