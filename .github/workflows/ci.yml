name: CI build on push

# Nightly is registered as disabled_fork, so pushes to develop built nothing until now.
# This file is deliberately only checkout + build + artifact: no set-marketing-version, no
# metadata, no Deploy, and no Upload Release, because that last step always returns HTTP 403
# on the fork and would leave every single commit looking failed.

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitmodules'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AirStore on push
    runs-on: macos-26

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - run: brew install ldid xcbeautify

      - name: Setup Env
        run: |
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)
          echo "MARKETING_VERSION=$MARKETING_VERSION" | tee -a $GITHUB_ENV
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a $GITHUB_ENV

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Restore Cache (exact)
        id: xcode-cache-exact
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-ci-${{ github.sha }}

      - name: Restore Cache (last)
        if: steps.xcode-cache-exact.outputs.cache-hit != 'true'
        id: xcode-cache-fallback
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-ci-

      - name: Build
        id: build
        run: python3 scripts/ci/workflow.py build

      - name: Save Cache
        if: ${{ steps.xcode-cache-fallback.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-ci-${{ github.sha }}

      - name: Verify the Chinese resources compiled
        run: |
          found=$(find SideStore.xcarchive -type d -name 'zh-Hans.lproj' | head -3)
          echo "zh-Hans.lproj: ${found:-none}"
          if [ -z "$found" ]; then
            echo "::error::zh-Hans.lproj is missing from the built app, so Localizable.xcstrings did not produce a Chinese table"
            exit 1
          fi

          # The Settings rows, tab bar and sign-in sheet are storyboard text, which is not in the
          # string catalog. A localized storyboard compiles to a storyboardc under zh-Hans.lproj;
          # an ignored .strings file leaves only the unlocalized one and the screen still reads
          # English, so this is the check that says whether the layout Xcode expects is met.
          storyboards=$(find SideStore.xcarchive -type d -path '*zh-Hans.lproj/*.storyboardc' | head -5)
          echo "localized storyboards: ${storyboards:-none}"
          if [ -z "$storyboards" ]; then
            echo "::error::no zh-Hans storyboard variant was built, so Settings, the tab bar and the sign-in sheet stay English"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AirStore-${{ env.SHORT_COMMIT }}.ipa
          path: SideStore.ipa
