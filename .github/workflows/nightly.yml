name: Nightly AirStore Build

on:
  # No push trigger: this built the same thing as ci.yml on every push and then failed on
  # Upload Release, which a fork cannot do. The daily schedule and the manual run are its job.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# Creating the rolling `nightly` release and force-pushing its tag needs write access; the default
# token is read-only, which is what made this job end with "HTTP 403: Resource not accessible by
# integration" on every run that actually built.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      DEPLOY_KEY: ${{ secrets.CROSS_REPO_PUSH_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: Nightly
      CHANNEL: nightly
      UPSTREAM_CHANNEL: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Find Last Successful commit
        run: |
          LAST_SUCCESSFUL_COMMIT=$(python3 scripts/ci/workflow.py last-successful-commit \
            "false" "${{ env.CHANNEL }}" || echo "")
          echo "LAST_SUCCESSFUL_COMMIT=$LAST_SUCCESSFUL_COMMIT" | tee -a $GITHUB_ENV

      - name: Check for new changes (on schedule)
        id: check_changes
        if: github.event_name == 'schedule'
        run: |
          NEW_COMMITS=$(python3 scripts/ci/workflow.py count-new-commits "$LAST_SUCCESSFUL_COMMIT")
          SHOULD_BUILD=$([ "${NEW_COMMITS:-0}" -ge 1 ] && echo true || echo false)
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "NEW_COMMITS=$NEW_COMMITS" | tee -a $GITHUB_ENV

      - name: Should Skip Building (on schedule)
        id: build_gate
        run: |
          SHOULD_SKIP=$(
            { [ "${{ github.event_name }}" = "schedule" ] && \
              [ "${{ steps.check_changes.outputs.should_build }}" != "true" ]; \
            } && echo true || echo false
          )
          echo "should_skip=$SHOULD_SKIP" >> $GITHUB_OUTPUT

      - run: brew install ldid xcbeautify
        if: steps.build_gate.outputs.should_skip != 'true'

      # --------------------------------------------------
      # runtime env setup
      # --------------------------------------------------
      - name: Setup Env
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          BUILD_NUM="${{ github.run_number }}"
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(python3 scripts/ci/workflow.py commit-id)

          # The version has to carry the track word: ReleaseTrackType.from(version:) looks for
          # "nightly" to file an install under the nightly channel, and without it a nightly build
          # was indistinguishable from a stable one. Same stamp shape as develop, deliberately
          # without "+": CFBundleShortVersionString has no room for semver build metadata, and the
          # strict parser rejects the whole version when it is there.
          STAMP=$(date -u +%Y%m%d%H%M)
          NORMALIZED_VERSION="${MARKETING_VERSION}-nightly-${STAMP}.${BUILD_NUM}-${SHORT_COMMIT}"
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"

          echo "BUILD_NUM=$BUILD_NUM" | tee -a $GITHUB_ENV
          echo "SHORT_COMMIT=$SHORT_COMMIT" | tee -a $GITHUB_ENV
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" | tee -a $GITHUB_ENV

      - name: Setup Xcode
        if: steps.build_gate.outputs.should_skip != 'true'
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      # Same correction as the develop pipeline: the old code restored a gigabyte of DerivedData on
      # every run and still recompiled all 745 files, because Xcode's incremental state keys off input
      # mtimes and a fresh checkout rewrites them. Only the resolved package checkouts are kept, and
      # the develop pipeline's copy is used when this one has nothing of its own.
      - name: Cache epoch
        id: epoch
        if: steps.build_gate.outputs.should_skip != 'true'
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the package checkouts
        if: steps.build_gate.outputs.should_skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-nightly-${{ steps.epoch.outputs.week }}-${{ hashFiles('**/Package.resolved', 'Build.xcconfig') }}
          restore-keys: |
            xcode-develop-airstore-
            xcode-nightly-

      # --------------------------------------------------
      # build and test
      # --------------------------------------------------
      - name: Clean
        if: steps.build_gate.outputs.should_skip != 'true' && contains(github.event.head_commit.message, '[--clean-build]')
        run: |
          python3 scripts/ci/workflow.py clean
          python3 scripts/ci/workflow.py clean-derived-data
          python3 scripts/ci/workflow.py clean-spm-cache

      - name: Boot simulator (async)
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_RUN == '1'
        run: |
          mkdir -p build/logs
          python3 scripts/ci/workflow.py boot-sim-async "iPhone 17 Pro"

      - name: Build
        if: steps.build_gate.outputs.should_skip != 'true'
        id: build
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          python3 scripts/ci/workflow.py build; STATUS=$?
          python3 scripts/ci/workflow.py encrypt-build
          echo "encrypted=true" >> $GITHUB_OUTPUT
          exit $STATUS

      - name: Tests Build
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_BUILD == '1'
        id: test-build
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          python3 scripts/ci/workflow.py tests-build; STATUS=$?
          python3 scripts/ci/workflow.py encrypt-tests-build
          exit $STATUS

      - name: Tests Run
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_RUN == '1'
        id: test-run
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          python3 scripts/ci/workflow.py tests-run "iPhone 17 Pro"; STATUS=$?
          python3 scripts/ci/workflow.py encrypt-tests-run
          exit $STATUS

      # --------------------------------------------------
      # artifacts
      # --------------------------------------------------
      - uses: actions/upload-artifact@v4
        if: steps.build_gate.outputs.should_skip != 'true'
        with:
          name: build-logs-${{ env.MARKETING_VERSION }}.zip
          path: build-logs.zip

      - uses: actions/upload-artifact@v4
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_BUILD == '1'
        with:
          name: tests-build-logs-${{ env.SHORT_COMMIT }}.zip
          path: tests-build-logs.zip

      - uses: actions/upload-artifact@v4
        if: >
          steps.build_gate.outputs.should_skip != 'true' &&
          vars.ENABLE_TESTS == '1' &&
          vars.ENABLE_TESTS_RUN == '1'
        with:
          name: tests-run-logs-${{ env.SHORT_COMMIT }}.zip
          path: tests-run-logs.zip

      - uses: actions/upload-artifact@v4
        if: steps.build_gate.outputs.should_skip != 'true'
        with:
          name: AirStore-${{ env.MARKETING_VERSION }}.ipa
          path: AirStore.ipa
      - uses: actions/upload-artifact@v4
        if: steps.build_gate.outputs.should_skip != 'true'
        with:
          name: AirStore-${{ env.MARKETING_VERSION }}-dSYMs.zip
          path: AirStore.dSYMs.zip

      - uses: actions/checkout@v4
        if: steps.build_gate.outputs.should_skip != 'true' && env.DEPLOY_KEY != ''
        with:
          repository: "SideStore/apps-v2.json"
          ref: "main"
          token: ${{ secrets.CROSS_REPO_PUSH_KEY }}
          path: "SideStore/apps-v2.json"

      - name: Generate Metadata
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          python3 scripts/ci/workflow.py dump-project-settings
          BUNDLE_ID=$(python3 scripts/ci/workflow.py read-bundle-id)
          echo "BUNDLE_ID=$BUNDLE_ID" | tee -a $GITHUB_ENV
          IPA_NAME="AirStore.ipa"

          python3 scripts/ci/workflow.py generate-metadata \
            "$CHANNEL" \
            "$SHORT_COMMIT" \
            "$MARKETING_VERSION" \
            "$CHANNEL" \
            "$BUNDLE_ID" \
            "$IPA_NAME" \
            "$LAST_SUCCESSFUL_COMMIT"

      - name: Deploy
        if: steps.build_gate.outputs.should_skip != 'true' && env.DEPLOY_KEY != ''
        run: |
          SOURCE_JSON="_includes/source.json"

          python3 scripts/ci/workflow.py deploy \
            SideStore/apps-v2.json \
            "$SOURCE_JSON" \
            "$CHANNEL" \
            "$MARKETING_VERSION"
      

      # --------------------------------------------------
      # upload release to GH
      # --------------------------------------------------
      - name: Upload Release
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          python3 scripts/ci/workflow.py upload-release \
            "$RELEASE_NAME" \
            "$CHANNEL" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "$UPSTREAM_CHANNEL"

      # A track is a channel inside one feed, not a feed of its own: every install reads
      # source/airstore-source.json on develop-source, so nightly has to be merged into the same file
      # the develop builds write. A separate branch would be a URL no phone ever asks for. The file the
      # last run left behind is the base, which is what keeps the stable and develop channels intact.
      - name: Publish the nightly channel
        if: steps.build_gate.outputs.should_skip != 'true'
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          mkdir -p build
          # A develop build can land between the fetch and the push, and both prepend to the same
          # versions array, so losing that race is expected rather than exceptional: regenerate on
          # top of whatever is on the branch now and try again.
          for attempt in 1 2 3; do
            git fetch --no-tags origin develop-source
            git show origin/develop-source:source/airstore-source.json > build/previous-feed.json

            python3 scripts/ci/develop_source.py \
              --source build/previous-feed.json \
              --ipa AirStore.ipa \
              --bundle-id "$BUNDLE_ID" \
              --version "$MARKETING_VERSION" \
              --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/AirStore.ipa" \
              --track nightly \
              --description "Nightly build $MARKETING_VERSION from commit $SHORT_COMMIT." \
              --out build/nightly-feed.json

            git checkout -B develop-source origin/develop-source
            cp build/nightly-feed.json source/airstore-source.json
            git add source/airstore-source.json
            if git -c user.name="github-actions[bot]" \
                   -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                   commit --allow-empty -m "Nightly build $MARKETING_VERSION" \
               && git push origin develop-source; then
              echo "nightly channel published on attempt $attempt"
              PUBLISHED=true
              break
            fi
            echo "attempt $attempt lost a race with a develop build; regenerating"
            sleep 5
          done

          # A silent miss here means the release exists but no phone can see it, which is worse than
          # a red run.
          if [ "${PUBLISHED:-false}" != "true" ]; then
            echo "::error::the nightly channel could not be published after 3 attempts"
            exit 1
          fi

      - name: Purge the CDN copy of the feed
        if: steps.build_gate.outputs.should_skip != 'true'
        run: |
          curl -fsS --max-time 20 "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@develop-source/source/airstore-source.json" >/dev/null \
            || echo "::warning::the purge request failed; the live proxies carry the feed either way"
