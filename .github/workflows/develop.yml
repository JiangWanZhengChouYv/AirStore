name: Develop AirStore build

# Every push to develop produces an installable build that AirStore can offer as an update to
# itself, so keeping the phone current no longer needs a computer: subscribe to the source, turn
# on beta updates, pick the develop track, tap update.
#
# The pipeline is shaped like a fishbone: one cheap head on Ubuntu works out what this build is,
# three build runners compile the store, AirBox and the desktop Helper (macOS and Windows) in
# parallel, and the tail on Ubuntu does everything that does not need Xcode or a Mac SDK (delta,
# release, feed, notice). macOS minutes are the scarce resource, so nothing that can run on Linux
# is allowed to occupy them.
#
# Two things this deliberately does not do:
#   - It does not touch the checked-in source JSON. The generated one is committed to the
#     develop-source branch, which is what the app fetches, so a machine never rewrites what a
#     human wrote on develop.
#   - It does not publish to a normal release. All builds land on one rolling prerelease tagged
#     develop-latest, whose assets are named after the build's version -- and, for a delta, after the
#     build it starts from -- so the package you are already on stays downloadable after the next push
#     replaces the feed. The feed carries the exact URL, so nothing downstream has to guess the name.

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitmodules'
      - '.swiftlint.yml'
      - '.github/**'
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: develop-latest
  cancel-in-progress: true

jobs:
  # The head of the fishbone. It only needs git and the checked-in xcconfig, so it runs on Ubuntu:
  # no Xcode, no submodules, seconds instead of minutes.
  prepare:
    name: Version the build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.version.outputs.version }}
      short_commit: ${{ steps.version.outputs.short_commit }}
      bundle_id: ${{ steps.version.outputs.bundle_id }}
      airbox: ${{ steps.changed.outputs.airbox }}
      helper: ${{ steps.changed.outputs.helper }}
      cache_week: ${{ steps.epoch.outputs.week }}

    steps:
      - uses: actions/checkout@v4
        with:
          # No submodules: versioning reads Build.xcconfig and git only. One commit is enough, and
          # fetching the full history was costing a minute on every run.
          fetch-depth: 1

      # AirBox and the Helper are the expensive ribs and they change far less often than the app, so
      # each one is skipped unless this push touched its inputs. The list comes from git, not from the
      # event payload: the payload's per-commit file lists are not guaranteed to be filled in, and an
      # empty list would quietly rebuild all three.
      - name: Work out which parts changed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          : > build-changed.txt
          # An all-zero "before" means a new branch; a force-push can leave a sha the remote no longer
          # serves. Both leave the list empty, which the script reads as "rebuild everything".
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" >/dev/null 2>&1 || true
            git diff --name-only "$BEFORE" HEAD > build-changed.txt 2>/dev/null || : > build-changed.txt
          fi
          echo "changed paths:"; cat build-changed.txt
          python3 scripts/ci/changed_parts.py --files build-changed.txt >> "$GITHUB_OUTPUT"

      # Coarse on purpose: within a week every run hits the exact cache key and uploads nothing, and
      # the first run of each week re-saves one fresh copy. A per-run key uploaded a gigabyte every
      # push and was evicting the other jobs' caches against the 10 GB budget.
      - name: Cache epoch
        id: epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Version this build
        id: version
        run: |
          BASE=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT=$(python3 scripts/ci/workflow.py commit-id)
          # The word "develop" in the version is what ReleaseTrackType.from(version:) reads to
          # classify an installed build, and the timestamp keeps the ordering meaningful --
          # a commit sha is unique but does not sort. Deliberately no `+`: this string goes into
          # CFBundleShortVersionString, and semver build metadata is not valid there.
          #
          # The stamp is one run-together number on purpose: a dotted "HHMM" component keeps its
          # leading zero before 10:00 UTC, and a numeric semver identifier may not have one. The
          # strict parser then rejects the whole version, which used to hide the develop channel
          # and offer the stable build as an "update" over a newer develop install.
          STAMP=$(python3 -c 'import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d%H%M"))')
          VERSION="${BASE}-develop-${STAMP}.${GITHUB_RUN_NUMBER}-${SHORT}"
          # Release builds PRODUCT_BUNDLE_IDENTIFIER from BASE_BUNDLE_ID, which is written as
          # $(ORG_IDENTIFIER).AirStore -- so expand that here instead of asking for Xcode.
          ORG=$(grep -E '^ORG_IDENTIFIER[[:space:]]*=' Build.xcconfig | sed -e 's/.*=[[:space:]]*//' -e 's/[[:space:]]*$//')
          BASE=$(grep -E '^BASE_BUNDLE_ID[[:space:]]*=' Build.xcconfig | sed -e 's/.*=[[:space:]]*//' -e 's/[[:space:]]*$//')
          BUNDLE_ID=$(printf '%s' "$BASE" | sed "s|\$(ORG_IDENTIFIER)|$ORG|")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_commit=${SHORT}" >> $GITHUB_OUTPUT
          echo "bundle_id=${BUNDLE_ID}" >> $GITHUB_OUTPUT
          echo "Building ${VERSION} (${BUNDLE_ID})"

  # One of the three ribs. Builds only SideStore.app: the "SideStore - Release" scheme carries no
  # AirBox buildable, so this runner never compiles the container and vice versa.
  build-airstore:
    name: Build AirStore
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - run: brew install ldid xcbeautify

      - name: Check the toolchain
        run: |
          # The action this replaced occasionally stalls for minutes on a network lookup, while a
          # macos-26 runner already boots with the 26.4 toolchain selected. Assert it instead of
          # fetching it, so a slow endpoint can never hold a Mac runner.
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "$major" -lt 26 ]; then
            echo "::error::the runner's default Xcode is $(xcodebuild -version | head -1); this build needs the 26 SDK"
            exit 1
          fi

      # What is cached here changed after measuring what the old cache was worth. Restoring the whole
      # DerivedData (1 GB, hit on every run) recompiled all 745 files every time: Xcode's incremental
      # state keys off input mtimes, and a fresh checkout gives every source a new one. So this keeps
      # only the resolved package checkouts, which are the part a fresh clone really has to re-fetch,
      # and drops the objects that were never reused.
      - name: Restore the compile cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-develop-airstore-${{ needs.prepare.outputs.cache_week }}-${{ hashFiles('**/Package.resolved', 'Build.xcconfig') }}
          restore-keys: |
            xcode-develop-airstore-

      - name: Build
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/ci/workflow.py build-airstore

      - name: Verify the Chinese resources compiled
        run: |
          found=$(find SideStore.xcarchive -type d -name 'zh-Hans.lproj' | head -3)
          echo "zh-Hans.lproj: ${found:-none}"
          if [ -z "$found" ]; then
            echo "::error::zh-Hans.lproj is missing from the built app, so Localizable.xcstrings did not produce a Chinese table"
            exit 1
          fi

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: airstore-ipa
          path: AirStore.ipa
          if-no-files-found: error

  # The other Xcode rib. Builds only AirBox.app (plus the LiveProcess extension it embeds).
  # Skipped when the push touched nothing it compiles: the previous package stays on the release and
  # the feed keeps pointing at it, so a settings-only change no longer pays for a container build.
  build-airbox:
    name: Build AirBox
    needs: prepare
    if: needs.prepare.outputs.airbox == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - run: brew install ldid xcbeautify

      - name: Check the toolchain
        run: |
          # The action this replaced occasionally stalls for minutes on a network lookup, while a
          # macos-26 runner already boots with the 26.4 toolchain selected. Assert it instead of
          # fetching it, so a slow endpoint can never hold a Mac runner.
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "$major" -lt 26 ]; then
            echo "::error::the runner's default Xcode is $(xcodebuild -version | head -1); this build needs the 26 SDK"
            exit 1
          fi

      - name: Restore the compile cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-develop-airbox-${{ needs.prepare.outputs.cache_week }}-${{ hashFiles('**/Package.resolved', 'Build.xcconfig') }}
          restore-keys: |
            xcode-develop-airbox-

      - name: Build
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/ci/workflow.py build-airbox

      - name: Check the extension kept its entry point
        run: |
          # UIKit finds UIApplicationMain by name at runtime, so nothing inside the binary refers to it and
          # dead-code stripping deletes the whole chain -- which reads on device as a tap that does
          # nothing, with no crash and no log line. Cheap to prove, expensive to miss.
          appex=SideStore.xcarchive/Products/Applications/AirBox.app/PlugIns/LiveProcess.appex/LiveProcess
          if [ ! -f "$appex" ]; then
            echo "::error::$appex is missing from the archive; AirBox shipped without the extension"
            exit 1
          fi
          if ! nm -gU "$appex" | grep -q "_UIApplicationMain"; then
            echo "::error::$appex exports no _UIApplicationMain; the linker stripped the extension's entry"
            exit 1
          fi
          echo "$appex keeps _UIApplicationMain"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: airbox-ipa
          path: AirBox.ipa
          if-no-files-found: error

  # The third rib. The Helper is a Tauri app: it needs Node, Rust and the macOS bundler, so it
  # cannot run on Ubuntu, and it shares none of the Xcode inputs the other two ribs use. It is a
  # sibling for that reason -- one broken Swift target should not hide a broken Helper, or the
  # other way round.
  build-helper:
    name: Build the Helper
    needs: prepare
    if: needs.prepare.outputs.helper == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # The Helper is inside this repository and has no submodules of its own.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Helper/package-lock.json

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore the last Helper build's cache
        uses: Swatinem/rust-cache@v2
        with:
          # Keyed separately from every other Rust cache: the dependency tree here is Tauri's,
          # and restoring another project's target directory only makes cargo redo the work.
          workspaces: Helper/src-tauri -> target
          key: airstore-helper

      - name: Build
        working-directory: Helper
        env:
          # No runner keychain holds "AirStore Helper Local", and a certificate generated per run
          # would still not match the keychain items the app itself created last time. Ad-hoc keeps
          # the CI artifact honest; the copy that touches the keychain is signed locally with the
          # stable certificate. -, not empty: an empty value falls back to the config's identity.
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          npm ci
          # The npm packages are newer than the Rust crates, and the Tauri CLI refuses that by
          # default. Pinning the npm side is not possible (the matching @tauri-apps/api version was
          # never published), so build through the mismatch instead of freezing the crate tree.
          npx tauri build --bundles app --ignore-version-mismatches

      - name: Check the app was bundled and signed
        run: |
          app="Helper/src-tauri/target/release/bundle/macos/AirStore Helper.app"
          if [ ! -d "$app" ]; then
            echo "::error::$app was not produced"
            exit 1
          fi
          codesign --verify --deep "$app"
          # Proves the run did not silently fall back to unsigned, which Apple silicon refuses to
          # launch anyway -- a CI artifact that cannot start is not a build.
          codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc"
          ditto -c -k --keepParent "$app" AirStoreHelper-macos.zip

      - name: Upload the Helper
        uses: actions/upload-artifact@v4
        with:
          name: airstore-helper-macos
          path: AirStoreHelper-macos.zip
          if-no-files-found: error

  # Same source, different bundler. Everything the Helper talks to has a Windows path -- usbmuxd
  # comes from Apple Mobile Device Support, the keychain is Credential Manager -- so this is a
  # build job, not a port.
  build-helper-windows:
    name: Build the Helper for Windows
    needs: prepare
    if: needs.prepare.outputs.helper == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Helper/package-lock.json

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore the last Windows Helper build's cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Helper/src-tauri -> target
          key: airstore-helper-windows

      - name: Build
        working-directory: Helper
        run: |
          npm ci
          npx tauri build --bundles nsis --ignore-version-mismatches

      - name: Locate the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "Helper/src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1
          if (-not $installer) {
            Write-Error "the NSIS installer was not produced"
            exit 1
          }
          Copy-Item $installer.FullName "AirStoreHelper-windows-x64-setup.exe"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: airstore-helper-windows
          path: AirStoreHelper-windows-x64-setup.exe
          if-no-files-found: error

  # The tail: everything after the packages exist, on Ubuntu. Delta packing is pure Python, and the
  # release and feed steps are git + gh + curl, so none of them has any business holding a macOS
  # runner.
  publish:
    name: Publish the develop channel
    needs: [prepare, build-airstore, build-airbox]
    # A skipped rib is fine: AirBox keeps the package already on the release and the feed carries its
    # entry forward. A failed one is not -- publishing then would offer an AirStore whose companion
    # was never rebuilt.
    if: ${{ !cancelled() && needs.build-airstore.result == 'success' && needs.build-airbox.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SHORT_COMMIT: ${{ needs.prepare.outputs.short_commit }}
      BUNDLE_ID: ${{ needs.prepare.outputs.bundle_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The mirror below fetches the pages and develop-source tips explicitly, so one commit of
          # this branch is enough; the scripts need no submodules.
          fetch-depth: 1

      - name: Fetch the AirStore package
        uses: actions/download-artifact@v4
        with:
          name: airstore-ipa
          path: .

      - name: Fetch the AirBox package
        if: needs.build-airbox.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: airbox-ipa
          path: .

      # Every package still inside the retention window is a possible base, so a phone that let a few
      # builds go by takes one delta instead of being sent back to the full download. A base has to be
      # the *unsigned* bundle: what lands on a phone gets re-signed (embedding.mobileprovision,
      # LC_CODE_SIGNATURE, _CodeSignature), and the device caches the ASBU of what its own unzip
      # produced, so only bytes packed this way can equal a phone's cached base.
      #
      # The target is packed from the ipa itself rather than from an archive: the ipa is what the
      # device unzips, so this is the same tree by construction, and it no longer needs a macOS runner.
      #
      # Newest by upload order, read off the REST asset id. Do not use `gh release view --json assets`
      # for this: its id is a GraphQL node string (RA_kwDOVM69jc4pC5Wr and friends), so ranking it
      # compares characters instead of time and picked a build two behind the live one on 2026-10-29,
      # which shipped a patch cut against a base no phone had. REST returns an increasing number.
      - name: Cut a delta from every package still on the release
        run: |
          mkdir -p build/previous
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/develop-latest" > build/release.json 2>/dev/null \
            || echo '{"assets":[]}' > build/release.json
          rm -rf build/target-unzipped
          unzip -qo AirStore.ipa -d build/target-unzipped
          python3 scripts/ci/make_patch.py pack \
            --app build/target-unzipped/Payload/SideStore.app --out build/target.asbu >/dev/null
          full_size=$(wc -c < AirStore.ipa | tr -d ' ')
          for base_name in $(python3 scripts/ci/delta_assets.py bases --release-json build/release.json --limit 4); do
            if ! gh release download develop-latest --pattern "$base_name" --dir build/previous --clobber; then
              echo "could not fetch $base_name; shipping without that base"
              continue
            fi
            unzip -qo "build/previous/$base_name" -d build/previous/unzipped
            base_sha=$(python3 scripts/ci/make_patch.py pack \
              --app build/previous/unzipped/Payload/SideStore.app --out build/base.asbu \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["asbuSHA256"])')
            patch_name=$(python3 scripts/ci/delta_assets.py name --package "$VERSION.ipa" --base-sha "$base_sha")
            python3 scripts/ci/make_patch.py create \
              --base build/base.asbu --target build/target.asbu --out "$patch_name"
            patch_size=$(wc -c < "$patch_name" | tr -d ' ')
            # A patch that costs nearly the whole download is not a patch. Publishing one would only
            # make the full-package fallback look like a decision rather than what it is.
            if [ "$patch_size" -gt $(( full_size * 8 / 10 )) ]; then
              echo "$patch_name is $patch_size of $full_size bytes; dropping it"
              rm -f "$patch_name"
            else
              echo "$base_name -> $VERSION: $patch_size bytes as $patch_name"
            fi
          done

      - name: Publish onto the rolling prerelease
        run: |
          gh release view develop-latest >/dev/null 2>&1 || \
            gh release create develop-latest --prerelease \
              --title "Develop builds" \
              --notes "Every build here is a snapshot of develop, replaced by the next push. \
          AirStore offers these as updates when the develop track is selected in Settings. \
          Not for distribution -- sign with your own Apple ID and expect breakage."
          # The package and its patches take the build's version as their name, so a build can never
          # be served with another build's counterpart. Each patch carries the base's own tag, which
          # is what a phone builds the URL from -- see scripts/ci/delta_assets.py.
          cp AirStore.ipa "$VERSION.ipa"
          gh release upload develop-latest "$VERSION.ipa" --clobber
          # AirBox rides along as a companion rather than a build: it never takes part in the delta
          # rotation, and pruning keeps only the newest copy (scripts/ci/delta_assets.py). A push that
          # did not rebuild it leaves the existing copy as the newest, so nothing has to be uploaded.
          if [ -f AirBox.ipa ]; then
            cp AirBox.ipa "AirBox-$VERSION.ipa"
            gh release upload develop-latest "AirBox-$VERSION.ipa" --clobber
          else
            echo "AirBox was not rebuilt; the package already on the release stays in place"
          fi
          for patch in "$VERSION"-*.patch; do
            [ -e "$patch" ] || continue
            gh release upload develop-latest "$patch" --clobber
          done

      - name: Keep only the last few builds on the rolling release
        run: |
          # Version names would otherwise pile up 30 MB per push, so the five newest builds stay --
          # each with every patch cut to or from it -- and anything older goes. Five is the horizon
          # because that is how far the delta step cuts: a build you are still on has to remain
          # downloadable exactly as long as it can still be a base.
          # REST again, for the same reason as the delta step: sorting the GraphQL node strings can
          # put the package uploaded seconds ago at the front of that list, and deleting it would
          # leave the feed pointing at an asset that is no longer there.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/develop-latest" > build/release.json
          python3 scripts/ci/delta_assets.py prune --release-json build/release.json --keep 5 | while read -r stale; do
            if [ -n "$stale" ]; then
              echo "pruning $stale"
              gh release delete-asset develop-latest "$stale" --yes || true
            fi
          done

      - name: Generate the source feed
        run: |
          # AirBox is optional in a given run. When it was not rebuilt, its live entry is carried over
          # verbatim -- version, size and hash included -- because that is the package still sitting
          # on the release; inventing a version for it would tell every phone it has an update.
          companion_args=()
          if [ -f AirBox.ipa ]; then
            companion_args=(
              --companion-ipa AirBox.ipa
              --companion-download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/develop-latest/AirBox-$VERSION.ipa"
              --companion-description "AirBox runs apps inside itself, so they do not use an App ID."
            )
          else
            mkdir -p build
            # The AirBox entry only exists in the generated feed, never in the checked-in source, so
            # this is where it is copied from. The branch is read directly rather than through the
            # contents API: the same fetch is needed two steps later to commit the new feed anyway.
            git fetch --depth=1 origin develop-source 2>/dev/null || true
            git show origin/develop-source:source/airstore-source.json > build/previous-feed.json 2>/dev/null \
              || echo '{"apps": []}' > build/previous-feed.json
            companion_args=(--companion-carry-from build/previous-feed.json)
          fi

          python3 scripts/ci/develop_source.py \
            --source source/airstore-source.json \
            --ipa "$VERSION.ipa" \
            --bundle-id "$BUNDLE_ID" \
            --version "$VERSION" \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/develop-latest/$VERSION.ipa" \
            --track develop \
            --description "Development build $VERSION from commit $SHORT_COMMIT." \
            --companion-bundle-id "$BUNDLE_ID.AirBox" \
            "${companion_args[@]}" \
            --out build/airstore-source.json

      # The app asks this repository's Pages site for a release asset before it tries any third-party
      # proxy, so the package and the patches have to exist there too. Which builds are current is the
      # release's decision, so the mirror is handed the same list the prune step just applied rather
      # than working out its own from file names.
      # The Pages mirror used to copy the kept packages onto the `pages` branch here. It is parked:
      # the app already prefers live pass-through proxies, and the replacement is a Cloudflare-hosted
      # mirror on a neutral domain that does not exist yet. Do not bring this one back in the
      # meantime -- re-uploading ~150 MB of assets every build was 1m22s of wall time for a fallback
      # almost nobody reached, and the app's pages URL is already the last resort in URL+Mirror.swift.

      - name: Commit the feed to its own branch
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git fetch origin develop-source 2>/dev/null || true
          if git rev-parse --verify -q origin/develop-source >/dev/null; then
            git checkout -b develop-source origin/develop-source
          else
            git checkout -b develop-source
          fi
          cp build/airstore-source.json source/airstore-source.json
          git add source/airstore-source.json
          # --allow-empty because re-running the same commit produces an identical feed, and a
          # workflow that goes red on "nothing to commit" teaches the wrong lesson.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -m "Develop build $VERSION"
          git push origin develop-source

      - name: Purge the CDN copy of the feed
        # The app reads source JSON through live pass-through proxies before jsDelivr, so a stale CDN
        # copy no longer decides what a phone sees. Watching the purge take effect was measured at
        # 1m17s on 2026-11-09 and never changed the outcome: the endpoint had already been observed
        # answering "finished" while still serving a build two behind. Ask once and move on.
        run: |
          curl -fsS --max-time 20 "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@develop-source/source/airstore-source.json" >/dev/null \
            || echo "::warning::the purge request failed; the live proxies carry the feed either way"

      - name: Upload the feed for debugging
        uses: actions/upload-artifact@v4
        with:
          name: airstore-source-${{ needs.prepare.outputs.short_commit }}.json
          path: build/airstore-source.json

  # The Helper's own home. It is a companion to the store rather than part of it, so its packages
  # do not ride on develop-latest: that release's asset names and pruning rules are built around
  # store versions, and a file with no .ipa suffix would be swept as stale on the next push. One
  # rolling prerelease, replaced whenever develop moves, is all it needs.
  publish-helper:
    name: Publish the Helper
    needs: [build-helper, build-helper-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # gh release runs against "this repository", which it learns from a git remote, so a bare
      # runner cannot publish even with the token set. One commit is enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch the macOS build
        uses: actions/download-artifact@v4
        with:
          name: airstore-helper-macos
          path: build/helper-macos

      - name: Fetch the Windows build
        uses: actions/download-artifact@v4
        with:
          name: airstore-helper-windows
          path: build/helper-windows

      - name: Publish onto the Helper prerelease
        env:
          REPO: ${{ github.repository }}
        run: |
          notes="$(cat <<EOF
          The desktop companion for AirStore: signs and installs AirStore from a Mac or a Windows PC
          over USB or the local network, and places the pairing file for you.

          Quick start - macOS: unzip AirStoreHelper-macos.zip and drag AirStore Helper to Applications.
          Windows: run AirStoreHelper-windows-x64-setup.exe. Install iTunes (Apple Mobile Device
          Support) first if the phone is not discovered. Full steps:
          https://github.com/$REPO/blob/develop/Helper/README.md

          These packages are built from develop and replaced whenever it moves. The Mac app is
          ad-hoc signed (right-click > Open the first time) and the Windows installer is unsigned,
          so SmartScreen warns; neither is notarized.
          EOF
          )"
          gh release view helper-latest >/dev/null 2>&1 || \
            gh release create helper-latest --prerelease --title "AirStore Helper" --notes "$notes"
          # Rewrite the notes on every run as well: the download names are part of them, and a
          # release describing files it no longer carries is worse than no notes at all.
          gh release edit helper-latest --title "AirStore Helper" --notes "$notes"
          gh release upload helper-latest build/helper-macos/AirStoreHelper-macos.zip --clobber
          gh release upload helper-latest build/helper-windows/AirStoreHelper-windows-x64-setup.exe --clobber

  # Its own job, listed after the pipeline the way Pages' deployment follows a push: the notification
  # needs a machine of its own for a two-second curl, and a build that got cancelled or died on the
  # Mac runner still has to say so. ubuntu-latest starts in seconds, so the note never delays a build.
  notify:
    name: Tell Discord how this build went
    needs: [prepare, build-airstore, build-airbox, build-helper, build-helper-windows, publish, publish-helper]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Post the result
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_AIRSTORE }}
          AIRSTORE_RESULT: ${{ needs.build-airstore.result }}
          AIRBOX_RESULT: ${{ needs.build-airbox.result }}
          HELPER_RESULT: ${{ needs.build-helper.result }}
          HELPER_WINDOWS_RESULT: ${{ needs.build-helper-windows.result }}
          HELPER_PUBLISH_RESULT: ${{ needs.publish-helper.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No webhook configured means silent, and a webhook that does not answer must never turn a
          # finished build red: this reports, it does not gate.
          if [ -z "$WEBHOOK" ]; then echo "no DISCORD_WEBHOOK_AIRSTORE secret -- nothing to tell"; exit 0; fi
          # A rib skipped because its inputs did not change did its job: the package it would have
          # built is still the newest one on the release, so it must not be reported as a failure.
          ok_or_skipped() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          SKIPPED=""
          if [ "$AIRBOX_RESULT" = "skipped" ]; then SKIPPED="AirBox"; fi
          if [ "$HELPER_RESULT" = "skipped" ]; then SKIPPED="${SKIPPED:+$SKIPPED + }Helper"; fi
          export SKIPPED
          # Publish witnesses both phone packages succeeding, but the Helper ribs are siblings it
          # does not need, so their results have to be added by hand. A cancelled rib or a skipped
          # publish is reported as cancelled, anything else as failure.
          if [ "$PUBLISH_RESULT" = "success" ] \
             && ok_or_skipped "$AIRBOX_RESULT" \
             && ok_or_skipped "$HELPER_RESULT" \
             && ok_or_skipped "$HELPER_WINDOWS_RESULT" \
             && ok_or_skipped "$HELPER_PUBLISH_RESULT"; then
            STATUS=success
          elif [ "$AIRSTORE_RESULT" = "cancelled" ] \
             || [ "$AIRBOX_RESULT" = "cancelled" ] \
             || [ "$HELPER_RESULT" = "cancelled" ] \
             || [ "$HELPER_WINDOWS_RESULT" = "cancelled" ] \
             || [ "$PUBLISH_RESULT" = "cancelled" ]; then
            STATUS=cancelled
          else
            STATUS=failure
          fi
          # Bilingual because the channel is read by people who file issues in either language.
          case "$STATUS" in
            success)   colour=5763719;  word="build succeeded / 构建成功" ;;
            cancelled) colour=16763904; word="cancelled / 构建被取消" ;;
            *)         colour=15158332; word="failed / 构建失败" ;;
          esac
          # What the build actually contains: a hash is not a changelog, and the one person reading this
          # at 11pm is deciding whether to update. Read from the commit rather than from the event
          # payload, because a re-run or a dispatch has no head_commit to offer.
          NOTES=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' 2>/dev/null || echo "")
          export NOTES
          # Python builds the JSON instead of printf, because a commit message is exactly the kind of
          # text that contains quotes, backslashes and newlines -- and an invalid payload means the
          # notice silently never arrives.
          payload=$(python3 - "$word" "$colour" <<'PY'
          import json, os, sys

          word, colour = sys.argv[1], int(sys.argv[2])
          version = os.environ.get("VERSION") or "no version yet"
          skipped = os.environ.get("SKIPPED", "")
          sha = os.environ.get("SHA", "")[:8]
          run_url = os.environ.get("RUN_URL", "")
          commit_url = os.environ.get("COMMIT_URL", "")
          notes = (os.environ.get("NOTES") or "").strip().splitlines()
          subject = notes[0].strip() if notes else ""
          body = "\n".join(notes[1:]).strip()
          # Discord caps an embed description at 4096 characters, so the body gets a budget and the rest
          # lives behind the commit link. Generous on purpose: whoever posts the daily announcement reads
          # this on a phone and writes from it, so more context here means less switching between apps.
          budget = 900
          if len(body) > budget:
              cut = body[:budget]
              cut = cut[:cut.rfind("\n")] if "\n" in cut[-90:] else cut
              body = cut.rstrip() + "…"

          lines = [version]
          if subject:
              lines.append("**%s**" % subject.replace("*", "\\*").replace("_", "\\_"))
          if body:
              lines.append(body.replace("`", "'"))
          if skipped:
              lines.append("未改动，跳过编译 / unchanged, not rebuilt: %s" % skipped)
          footer = "commit %s" % sha
          if commit_url:
              footer += " · [full message / 完整说明](%s)" % commit_url
          lines.append(footer + " · [build log / 构建日志](%s)" % run_url)
          if os.environ.get("PUBLISH_RESULT") == "success":
              lines.append("Update on the phone within a minute / 手机上等一分钟就能看到更新")

          print(json.dumps({"embeds": [{
              "title": "AirStore develop %s" % word,
              "description": "\n\n".join(lines),
              "color": colour,
          }]}))
          PY
          )
          curl -fsS -m 20 -H 'content-type: application/json' -X POST "$WEBHOOK" -d "$payload" >/dev/null \
            || echo "::warning::the Discord webhook did not answer"
