name: Develop AirStore build

# Every push to develop produces an installable build that AirStore can offer as an update to
# itself, so keeping the phone current no longer needs a computer: subscribe to the source, turn
# on beta updates, pick the develop track, tap update.
#
# Two things this deliberately does not do:
#   - It does not touch the checked-in source JSON. The generated one is committed to the
#     develop-source branch, which is what the app fetches, so a machine never rewrites what a
#     human wrote on develop.
#   - It does not publish to a normal release. All builds land on one rolling prerelease tagged
#     develop-latest, whose assets are named after the build's version, so the package you are
#     already on stays downloadable after the next push replaces the feed. The feed carries the
#     exact URL, so nothing downstream has to guess the name.

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitmodules'
      - '.github/**'
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: develop-latest
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish the develop channel
    runs-on: macos-26

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Version this build
        run: |
          BASE=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT=$(python3 scripts/ci/workflow.py commit-id)
          # The word "develop" in the version is what ReleaseTrackType.from(version:) reads to
          # classify an installed build, and the timestamp keeps the ordering meaningful --
          # a commit sha is unique but does not sort. Deliberately no `+`: this string goes into
          # CFBundleShortVersionString, and semver build metadata is not valid there.
          #
          # The stamp is one run-together number on purpose: a dotted "HHMM" component keeps its
          # leading zero before 10:00 UTC, and a numeric semver identifier may not have one. The
          # strict parser then rejects the whole version, which used to hide the develop channel
          # and offer the stable build as an "update" over a newer develop install.
          STAMP=$(python3 -c 'import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d%H%M"))')
          echo "VERSION=${BASE}-develop-${STAMP}.${GITHUB_RUN_NUMBER}-${SHORT}" | tee -a $GITHUB_ENV
          echo "SHORT_COMMIT=${SHORT}" | tee -a $GITHUB_ENV

      - name: Restore Cache (exact)
        id: xcode-cache-exact
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-develop-${{ github.sha }}

      - name: Restore Cache (last)
        if: steps.xcode-cache-exact.outputs.cache-hit != 'true'
        id: xcode-cache-fallback
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-develop-

      - name: Build
        env:
          MARKETING_VERSION: ${{ env.VERSION }}
        run: python3 scripts/ci/workflow.py build

      - name: Save Cache
        if: ${{ steps.xcode-cache-fallback.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-develop-${{ github.sha }}

      - name: Verify the Chinese resources compiled
        run: |
          found=$(find SideStore.xcarchive -type d -name 'zh-Hans.lproj' | head -3)
          echo "zh-Hans.lproj: ${found:-none}"
          if [ -z "$found" ]; then
            echo "::error::zh-Hans.lproj is missing from the built app, so Localizable.xcstrings did not produce a Chinese table"
            exit 1
          fi

      # Grab the package that is live right now, before the upload below replaces it. This is the
      # delta's base, and it has to be the *unsigned* bundle: what lands on a phone gets re-signed
      # (embedding.mobileprovision, LC_CODE_SIGNATURE, _CodeSignature), so the device caches its
      # ASBU at unzip time, before signing, and only bytes produced the same way here will match it.
      # Newest by asset id rather than by name, because the names now carry the version.
      - name: Fetch the previous package for the delta
        run: |
          mkdir -p build/previous
          previous=$(gh release view develop-latest --json assets --jq \
            '[.assets[] | select(.name | endswith(".ipa"))] | max_by(.id) | .name' 2>/dev/null || true)
          echo "base package: ${previous:-none}"
          if [ -n "$previous" ] && gh release download develop-latest --pattern "$previous" --dir build/previous --clobber; then
            python3 scripts/ci/make_patch.py pack \
              --app SideStore.xcarchive/Products/Applications/SideStore.app --out build/target.asbu
            unzip -qo "build/previous/$previous" -d build/previous/unzipped
            python3 scripts/ci/make_patch.py pack \
              --app build/previous/unzipped/Payload/SideStore.app --out build/base.asbu
            python3 scripts/ci/make_patch.py create \
              --base build/base.asbu --target build/target.asbu --out AirStore.patch
          else
            echo "No previous package on develop-latest yet; shipping without a delta."
          fi

      - name: Publish onto the rolling prerelease
        run: |
          gh release view develop-latest >/dev/null 2>&1 || \
            gh release create develop-latest --prerelease \
              --title "Develop builds" \
              --notes "Every build here is a snapshot of develop, replaced by the next push. \
          AirStore offers these as updates when the develop track is selected in Settings. \
          Not for distribution -- sign with your own Apple ID and expect breakage."
          # The package and the patch take the build's version as their name, so one pair can never
          # be served with another build's counterpart, and BundleDelta finds the patch by swapping
          # the extension on the URL the feed already gives it.
          cp AirStore.ipa "$VERSION.ipa"
          gh release upload develop-latest "$VERSION.ipa" --clobber
          if [ -f AirStore.patch ]; then
            cp AirStore.patch "$VERSION.patch"
            gh release upload develop-latest "$VERSION.patch" --clobber
          fi

      - name: Keep only the last few builds on the rolling release
        run: |
          # Version names would otherwise pile up 30 MB per push, so the five newest pairs go and
          # everything older is pruned. Five is the horizon: a build you are still on has to stay
          # downloadable long enough to be the base of the patch that updates it.
          gh release view develop-latest --json assets --jq \
            '[.assets[] | select((.name | endswith(".ipa")) or (.name | endswith(".patch")))]
             | sort_by(.id) | .[0:-10] | .[].name' 2>/dev/null | while read -r stale; do
            echo "pruning $stale"
            gh release delete-asset develop-latest "$stale" --yes || true
          done

      - name: Generate the source feed
        run: |
          python3 scripts/ci/develop_source.py \
            --source source/airstore-source.json \
            --ipa "$VERSION.ipa" \
            --bundle-id "$(python3 scripts/ci/workflow.py get-bundle-id)" \
            --version "$VERSION" \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/develop-latest/$VERSION.ipa" \
            --track develop \
            --description "Development build $VERSION from commit $SHORT_COMMIT." \
            --out build/airstore-source.json

      - name: Commit the feed to its own branch
        run: |
          git fetch origin develop-source 2>/dev/null || true
          if git rev-parse --verify -q origin/develop-source >/dev/null; then
            git checkout -b develop-source origin/develop-source
          else
            git checkout -b develop-source
          fi
          cp build/airstore-source.json source/airstore-source.json
          git add source/airstore-source.json
          # --allow-empty because re-running the same commit produces an identical feed, and a
          # workflow that goes red on "nothing to commit" teaches the wrong lesson.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -m "Develop build $VERSION"
          git push origin develop-source

      - name: Purge the CDN copy of the feed
        run: |
          # jsDelivr caches a branch URL until told otherwise, so without this the app can keep
          # reading a feed several builds old -- which is exactly what made an update card offer a
          # build from the day before. The purge endpoint takes the same path as the CDN URL.
          curl -fsS "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@develop-source/source/airstore-source.json" || true

      - name: Upload the feed for debugging
        uses: actions/upload-artifact@v4
        with:
          name: airstore-source-${{ env.SHORT_COMMIT }}.json
          path: build/airstore-source.json
