name: Develop AirStore build

# Every push to develop produces an installable build that AirStore can offer as an update to
# itself, so keeping the phone current no longer needs a computer: subscribe to the source, turn
# on beta updates, pick the develop track, tap update.
#
# The pipeline is shaped like a fishbone: one cheap head on Ubuntu works out what this build is,
# two macOS runners compile the store and AirBox in parallel, and the tail on Ubuntu does everything
# that does not need Xcode (delta, release, feed, mirror, notice). macOS minutes are the scarce
# resource, so nothing that can run on Linux is allowed to occupy them.
#
# Two things this deliberately does not do:
#   - It does not touch the checked-in source JSON. The generated one is committed to the
#     develop-source branch, which is what the app fetches, so a machine never rewrites what a
#     human wrote on develop.
#   - It does not publish to a normal release. All builds land on one rolling prerelease tagged
#     develop-latest, whose assets are named after the build's version -- and, for a delta, after the
#     build it starts from -- so the package you are already on stays downloadable after the next push
#     replaces the feed. The feed carries the exact URL, so nothing downstream has to guess the name.

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitmodules'
      - '.swiftlint.yml'
      - '.github/**'
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: develop-latest
  cancel-in-progress: true

jobs:
  # The head of the fishbone. It only needs git and the checked-in xcconfig, so it runs on Ubuntu:
  # no Xcode, no submodules, seconds instead of minutes.
  prepare:
    name: Version the build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.version.outputs.version }}
      short_commit: ${{ steps.version.outputs.short_commit }}
      bundle_id: ${{ steps.version.outputs.bundle_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          # No submodules: versioning reads Build.xcconfig and git only.
          fetch-depth: 0

      - name: Version this build
        id: version
        run: |
          BASE=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT=$(python3 scripts/ci/workflow.py commit-id)
          # The word "develop" in the version is what ReleaseTrackType.from(version:) reads to
          # classify an installed build, and the timestamp keeps the ordering meaningful --
          # a commit sha is unique but does not sort. Deliberately no `+`: this string goes into
          # CFBundleShortVersionString, and semver build metadata is not valid there.
          #
          # The stamp is one run-together number on purpose: a dotted "HHMM" component keeps its
          # leading zero before 10:00 UTC, and a numeric semver identifier may not have one. The
          # strict parser then rejects the whole version, which used to hide the develop channel
          # and offer the stable build as an "update" over a newer develop install.
          STAMP=$(python3 -c 'import datetime; print(datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d%H%M"))')
          VERSION="${BASE}-develop-${STAMP}.${GITHUB_RUN_NUMBER}-${SHORT}"
          # Release builds PRODUCT_BUNDLE_IDENTIFIER straight from BASE_BUNDLE_ID, which is
          # $(ORG_IDENTIFIER).SideStore -- so this reproduces what xcodebuild -showBuildSettings
          # used to answer, without needing Xcode on this runner.
          ORG=$(grep -E '^ORG_IDENTIFIER[[:space:]]*=' Build.xcconfig | sed -e 's/.*=[[:space:]]*//' -e 's/[[:space:]]*$//')
          BUNDLE_ID="${ORG}.SideStore"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_commit=${SHORT}" >> $GITHUB_OUTPUT
          echo "bundle_id=${BUNDLE_ID}" >> $GITHUB_OUTPUT
          echo "Building ${VERSION} (${BUNDLE_ID})"

  # One of the two ribs. Builds only SideStore.app: the "SideStore - Release" scheme carries no
  # AirBox buildable, so this runner never compiles the container and vice versa.
  build-airstore:
    name: Build AirStore
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Restore the last AirStore build's cache
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          # A key no run has ever written, so the lookup always falls through to restore-keys and takes
          # the newest cache whoever ran before left behind -- which is the only one that can make this
          # build incremental. The prefix is per job so the two ribs never restore each other's objects.
          key: xcode-build-cache-develop-airstore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xcode-build-cache-develop-airstore-

      - name: Build
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/ci/workflow.py build-airstore

      - name: Verify the Chinese resources compiled
        run: |
          found=$(find SideStore.xcarchive -type d -name 'zh-Hans.lproj' | head -3)
          echo "zh-Hans.lproj: ${found:-none}"
          if [ -z "$found" ]; then
            echo "::error::zh-Hans.lproj is missing from the built app, so Localizable.xcstrings did not produce a Chinese table"
            exit 1
          fi

      - name: Save Cache
        uses: actions/cache/save@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-develop-airstore-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: airstore-ipa
          path: AirStore.ipa
          if-no-files-found: error

  # The other rib. Builds only AirBox.app (plus the LiveProcess extension it embeds).
  build-airbox:
    name: Build AirBox
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Restore the last AirBox build's cache
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-develop-airbox-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xcode-build-cache-develop-airbox-

      - name: Build
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/ci/workflow.py build-airbox

      - name: Check the extension kept its entry point
        run: |
          # UIKit finds UIApplicationMain by name at runtime, so nothing inside the binary refers to it and
          # dead-code stripping deletes the whole chain -- which reads on device as a tap that does
          # nothing, with no crash and no log line. Cheap to prove, expensive to miss.
          appex=SideStore.xcarchive/Products/Applications/AirBox.app/PlugIns/LiveProcess.appex/LiveProcess
          if [ ! -f "$appex" ]; then
            echo "::error::$appex is missing from the archive; AirBox shipped without the extension"
            exit 1
          fi
          if ! nm -gU "$appex" | grep -q "_UIApplicationMain"; then
            echo "::error::$appex exports no _UIApplicationMain; the linker stripped the extension's entry"
            exit 1
          fi
          echo "$appex keeps _UIApplicationMain"

      - name: Save Cache
        uses: actions/cache/save@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-develop-airbox-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: airbox-ipa
          path: AirBox.ipa
          if-no-files-found: error

  # The tail: everything after the packages exist, on Ubuntu. Delta packing is pure Python, and the
  # release, feed and mirror steps are git + gh + curl, so none of them has any business holding a
  # macOS runner.
  publish:
    name: Publish the develop channel
    needs: [prepare, build-airstore, build-airbox]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SHORT_COMMIT: ${{ needs.prepare.outputs.short_commit }}
      BUNDLE_ID: ${{ needs.prepare.outputs.bundle_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Branch work below (pages, develop-source) needs history; the scripts need no submodules.
          fetch-depth: 0

      - name: Fetch the AirStore package
        uses: actions/download-artifact@v4
        with:
          name: airstore-ipa
          path: .

      - name: Fetch the AirBox package
        uses: actions/download-artifact@v4
        with:
          name: airbox-ipa
          path: .

      # Every package still inside the retention window is a possible base, so a phone that let a few
      # builds go by takes one delta instead of being sent back to the full download. A base has to be
      # the *unsigned* bundle: what lands on a phone gets re-signed (embedding.mobileprovision,
      # LC_CODE_SIGNATURE, _CodeSignature), and the device caches the ASBU of what its own unzip
      # produced, so only bytes packed this way can equal a phone's cached base.
      #
      # The target is packed from the ipa itself rather than from an archive: the ipa is what the
      # device unzips, so this is the same tree by construction, and it no longer needs a macOS runner.
      #
      # Newest by upload order, read off the REST asset id. Do not use `gh release view --json assets`
      # for this: its id is a GraphQL node string (RA_kwDOVM69jc4pC5Wr and friends), so ranking it
      # compares characters instead of time and picked a build two behind the live one on 2026-10-29,
      # which shipped a patch cut against a base no phone had. REST returns an increasing number.
      - name: Cut a delta from every package still on the release
        run: |
          mkdir -p build/previous
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/develop-latest" > build/release.json 2>/dev/null \
            || echo '{"assets":[]}' > build/release.json
          rm -rf build/target-unzipped
          unzip -qo AirStore.ipa -d build/target-unzipped
          python3 scripts/ci/make_patch.py pack \
            --app build/target-unzipped/Payload/SideStore.app --out build/target.asbu >/dev/null
          full_size=$(wc -c < AirStore.ipa | tr -d ' ')
          for base_name in $(python3 scripts/ci/delta_assets.py bases --release-json build/release.json --limit 4); do
            if ! gh release download develop-latest --pattern "$base_name" --dir build/previous --clobber; then
              echo "could not fetch $base_name; shipping without that base"
              continue
            fi
            unzip -qo "build/previous/$base_name" -d build/previous/unzipped
            base_sha=$(python3 scripts/ci/make_patch.py pack \
              --app build/previous/unzipped/Payload/SideStore.app --out build/base.asbu \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["asbuSHA256"])')
            patch_name=$(python3 scripts/ci/delta_assets.py name --package "$VERSION.ipa" --base-sha "$base_sha")
            python3 scripts/ci/make_patch.py create \
              --base build/base.asbu --target build/target.asbu --out "$patch_name"
            patch_size=$(wc -c < "$patch_name" | tr -d ' ')
            # A patch that costs nearly the whole download is not a patch. Publishing one would only
            # make the full-package fallback look like a decision rather than what it is.
            if [ "$patch_size" -gt $(( full_size * 8 / 10 )) ]; then
              echo "$patch_name is $patch_size of $full_size bytes; dropping it"
              rm -f "$patch_name"
            else
              echo "$base_name -> $VERSION: $patch_size bytes as $patch_name"
            fi
          done

      - name: Publish onto the rolling prerelease
        run: |
          gh release view develop-latest >/dev/null 2>&1 || \
            gh release create develop-latest --prerelease \
              --title "Develop builds" \
              --notes "Every build here is a snapshot of develop, replaced by the next push. \
          AirStore offers these as updates when the develop track is selected in Settings. \
          Not for distribution -- sign with your own Apple ID and expect breakage."
          # The package and its patches take the build's version as their name, so a build can never
          # be served with another build's counterpart. Each patch carries the base's own tag, which
          # is what a phone builds the URL from -- see scripts/ci/delta_assets.py.
          cp AirStore.ipa "$VERSION.ipa"
          gh release upload develop-latest "$VERSION.ipa" --clobber
          # AirBox rides along as a companion rather than a build: it never takes part in the delta
          # rotation, and pruning keeps only the newest copy (scripts/ci/delta_assets.py).
          cp AirBox.ipa "AirBox-$VERSION.ipa"
          gh release upload develop-latest "AirBox-$VERSION.ipa" --clobber
          for patch in "$VERSION"-*.patch; do
            [ -e "$patch" ] || continue
            gh release upload develop-latest "$patch" --clobber
          done

      - name: Keep only the last few builds on the rolling release
        run: |
          # Version names would otherwise pile up 30 MB per push, so the five newest builds stay --
          # each with every patch cut to or from it -- and anything older goes. Five is the horizon
          # because that is how far the delta step cuts: a build you are still on has to remain
          # downloadable exactly as long as it can still be a base.
          # REST again, for the same reason as the delta step: sorting the GraphQL node strings can
          # put the package uploaded seconds ago at the front of that list, and deleting it would
          # leave the feed pointing at an asset that is no longer there.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/develop-latest" > build/release.json
          python3 scripts/ci/delta_assets.py prune --release-json build/release.json --keep 5 | while read -r stale; do
            if [ -n "$stale" ]; then
              echo "pruning $stale"
              gh release delete-asset develop-latest "$stale" --yes || true
            fi
          done

      - name: Generate the source feed
        run: |
          python3 scripts/ci/develop_source.py \
            --source source/airstore-source.json \
            --ipa "$VERSION.ipa" \
            --bundle-id "$BUNDLE_ID" \
            --version "$VERSION" \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/develop-latest/$VERSION.ipa" \
            --track develop \
            --description "Development build $VERSION from commit $SHORT_COMMIT." \
            --companion-bundle-id "$BUNDLE_ID.AirBox" \
            --companion-ipa AirBox.ipa \
            --companion-download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/develop-latest/AirBox-$VERSION.ipa" \
            --companion-description "AirBox runs apps inside itself, so they do not use an App ID." \
            --out build/airstore-source.json

      # The app asks this repository's Pages site for a release asset before it tries any third-party
      # proxy, so the package and the patches have to exist there too. Which builds are current is the
      # release's decision, so the mirror is handed the same list the prune step just applied rather
      # than working out its own from file names.
      - name: Mirror the package onto the Pages branch
        env:
          # A push that cannot authenticate asks for a username on stdin, and on a runner with no
          # terminal that turns into a six-minute silence instead of an error. Fail fast instead.
          GIT_TERMINAL_PROMPT: 0
        run: |
          # Ask before switching branches: the pages tree holds nothing but assets, so once it is
          # checked out there is no scripts/ci left to ask. The answer lands in build/, which is
          # untracked and therefore survives the switch.
          python3 scripts/ci/delta_assets.py kept --release-json build/release.json --keep 5 > build/kept.txt

          git fetch origin pages 2>/dev/null || true
          if git rev-parse --verify -q origin/pages >/dev/null; then
            git checkout -b pages origin/pages
          else
            git checkout --orphan pages
            git rm -rf --cached . -q
          fi

          while read -r name; do
            if [ -n "$name" ] && [ -e "$name" ]; then
              git add "$name"
            fi
          done < build/kept.txt

          git ls-files | while read -r tracked; do
            if ! grep -q -x -- "$tracked" build/kept.txt; then
              echo "dropping $tracked"
              git rm -q --cached "$tracked"
              rm -f "$tracked"
            fi
          done

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q --allow-empty -m "Publish $VERSION"
          # GIT_TERMINAL_PROMPT=0 is the whole cure: the stall was `git push` waiting on stdin for a
          # username. `timeout` is not installed on the macOS runner, so bounding each command here
          # would only make the step red -- timeout-minutes on the job is the real ceiling.
          git push origin pages

      - name: Commit the feed to its own branch
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git fetch origin develop-source 2>/dev/null || true
          if git rev-parse --verify -q origin/develop-source >/dev/null; then
            git checkout -b develop-source origin/develop-source
          else
            git checkout -b develop-source
          fi
          cp build/airstore-source.json source/airstore-source.json
          git add source/airstore-source.json
          # --allow-empty because re-running the same commit produces an identical feed, and a
          # workflow that goes red on "nothing to commit" teaches the wrong lesson.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -m "Develop build $VERSION"
          git push origin develop-source

      - name: Purge the CDN copy of the feed
        run: |
          # jsDelivr caches a branch URL until told otherwise, so without this the app can keep
          # reading a feed several builds old -- which is what made an update card offer a build from
          # the day before. Measured 2026-10-29 though: the purge endpoint answers "finished" and then
          # keeps serving a file two builds old for 15+ minutes, and it ignores cache-busting query
          # strings, so "we asked" is not the same as "it worked". Ask, then poll for two minutes and
          # say out loud whether it actually took.
          curl -fsS "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@develop-source/source/airstore-source.json" >/dev/null \
            || echo "::warning::the purge request itself failed"
          for attempt in 1 2 3 4 5 6 7 8; do
            sleep 15
            served=$(curl -fsS --max-time 20 \
              "https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@develop-source/source/airstore-source.json" \
              | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next((c["releases"][0]["version"] for c in d["apps"][0]["releaseChannels"] if c["track"]=="develop"), ""))' 2>/dev/null || true)
            if [ "$served" = "$VERSION" ]; then
              echo "jsDelivr is serving $VERSION after ${attempt} checks"
              exit 0
            fi
            echo "attempt $attempt: jsDelivr still on ${served:-unreadable}"
          done
          # Not a failure: since 3422e96d the app reads source JSON through live pass-through proxies
          # first, so a stale CDN copy no longer decides what the phone gets to see.
          echo "::warning::jsDelivr still not serving $VERSION after two minutes -- the app prefers the live proxies, so this is no longer fatal"

      - name: Upload the feed for debugging
        uses: actions/upload-artifact@v4
        with:
          name: airstore-source-${{ needs.prepare.outputs.short_commit }}.json
          path: build/airstore-source.json

  # Its own job, listed after the pipeline the way Pages' deployment follows a push: the notification
  # needs a machine of its own for a two-second curl, and a build that got cancelled or died on the
  # Mac runner still has to say so. ubuntu-latest starts in seconds, so the note never delays a build.
  notify:
    name: Tell Discord how this build went
    needs: [prepare, build-airstore, build-airbox, publish]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Post the result
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_AIRSTORE }}
          AIRSTORE_RESULT: ${{ needs.build-airstore.result }}
          AIRBOX_RESULT: ${{ needs.build-airbox.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No webhook configured means silent, and a webhook that does not answer must never turn a
          # finished build red: this reports, it does not gate.
          if [ -z "$WEBHOOK" ]; then echo "no DISCORD_WEBHOOK_AIRSTORE secret -- nothing to tell"; exit 0; fi
          # Publish is the only job that witnesses both ribs succeeding, so its result decides; a
          # cancelled rib or a skipped publish is reported as cancelled, anything else as failure.
          if [ "$PUBLISH_RESULT" = "success" ]; then
            STATUS=success
          elif [ "$AIRSTORE_RESULT" = "cancelled" ] || [ "$AIRBOX_RESULT" = "cancelled" ] || [ "$PUBLISH_RESULT" = "cancelled" ]; then
            STATUS=cancelled
          else
            STATUS=failure
          fi
          # Bilingual because the channel is read by people who file issues in either language.
          case "$STATUS" in
            success)   colour=5763719;  word="build succeeded / 构建成功" ;;
            cancelled) colour=16763904; word="cancelled / 构建被取消" ;;
            *)         colour=15158332; word="failed / 构建失败" ;;
          esac
          # What the build actually contains: a hash is not a changelog, and the one person reading this
          # at 11pm is deciding whether to update. Read from the commit rather than from the event
          # payload, because a re-run or a dispatch has no head_commit to offer.
          NOTES=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' 2>/dev/null || echo "")
          export NOTES
          # Python builds the JSON instead of printf, because a commit message is exactly the kind of
          # text that contains quotes, backslashes and newlines -- and an invalid payload means the
          # notice silently never arrives.
          payload=$(python3 - "$word" "$colour" <<'PY'
          import json, os, sys

          word, colour = sys.argv[1], int(sys.argv[2])
          version = os.environ.get("VERSION") or "no version yet"
          sha = os.environ.get("SHA", "")[:8]
          run_url = os.environ.get("RUN_URL", "")
          commit_url = os.environ.get("COMMIT_URL", "")
          notes = (os.environ.get("NOTES") or "").strip().splitlines()
          subject = notes[0].strip() if notes else ""
          body = "\n".join(notes[1:]).strip()
          # Discord caps an embed description at 4096 characters, so the body gets a budget and the rest
          # lives behind the commit link. Generous on purpose: whoever posts the daily announcement reads
          # this on a phone and writes from it, so more context here means less switching between apps.
          budget = 900
          if len(body) > budget:
              cut = body[:budget]
              cut = cut[:cut.rfind("\n")] if "\n" in cut[-90:] else cut
              body = cut.rstrip() + "…"

          lines = [version]
          if subject:
              lines.append("**%s**" % subject.replace("*", "\\*").replace("_", "\\_"))
          if body:
              lines.append(body.replace("`", "'"))
          footer = "commit %s" % sha
          if commit_url:
              footer += " · [full message / 完整说明](%s)" % commit_url
          lines.append(footer + " · [build log / 构建日志](%s)" % run_url)
          if os.environ.get("PUBLISH_RESULT") == "success":
              lines.append("Update on the phone within a minute / 手机上等一分钟就能看到更新")

          print(json.dumps({"embeds": [{
              "title": "AirStore develop %s" % word,
              "description": "\n\n".join(lines),
              "color": colour,
          }]}))
          PY
          )
          curl -fsS -m 20 -H 'content-type: application/json' -X POST "$WEBHOOK" -d "$payload" >/dev/null \
            || echo "::warning::the Discord webhook did not answer"
