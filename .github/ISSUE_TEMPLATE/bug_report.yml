name: Bug Report
description: Report a bug
title: "[BUG] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        AirStore is maintained by one person in their spare time, so the details below are what make an issue possible to act on.

        Before you continue, please **[search the open issues](https://github.com/JiangWanZhengChouYv/AirStore/issues?q=is%3Aissue+is%3Aopen)** in case this has already been reported.

        Issues are the only support channel for this project. The SideStore Discord and Discussions are run by upstream and are not monitored by this maintainer.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What is the bug and how did you discover it?
      placeholder: Please be clear and concise with your description.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: Instructions to reproduce
      description: Please include clear and consistent instructions for reproducing the bug to make it easier to fix.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: What version of AirStore are you using?
      description: Go to `Settings` in the app and scroll down to the bottom. Builds off `develop` are still labeled `SideStore` on the Home Screen.
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: What iOS version and build are you on?
      description: For example, `26.4 (23E251)`. The `-80045` error is version specific, so the exact build matters.
      placeholder: 26.4 (23E251)
    validations:
      required: true
  - type: dropdown
    id: anisette-error
    attributes:
      label: Is this the `-80045` authentication error?
      description: Fixing `-80045` on iOS 26.4+ is the primary goal of this repository, so these reports get looked at first.
      options:
        - "Yes — `-80045` when signing in with an Apple ID"
        - "No — a different error"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: anisette-config
    attributes:
      label: Apple ID and Anisette configuration
      description: Two-factor on or off, whether `On-Device Anisette` is enabled under `Settings > Advanced > User Customizations`, and which Anisette server or provider you selected.
      placeholder: "2FA: yes / On-Device Anisette: off / Server: <the URL or list entry you used>"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Open `Settings > Error Log`, tap `Export Log`, and attach or paste the result. An issue without logs usually cannot be triaged.
      render: text
    validations:
      required: true
  - type: textarea
    id: other-info
    attributes:
      label: Other info
      description: If you have any other comments, other info that might be useful, or if you found a workaround, please put it here.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open issues and this has not already been reported.
          required: true
        - label: I removed my Apple ID, any passwords, pairing files, and device UDID from the report.
          required: true
