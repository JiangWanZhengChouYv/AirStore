name: Feature Request
description: Suggest a feature
title: "[FEATURE REQUEST] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!

        Before you continue, please **[search the open issues](https://github.com/JiangWanZhengChouYv/AirStore/issues?q=is%3Aissue+is%3Aopen)** in case this has already been suggested.

        Please keep in mind what this repository is for: AirStore is a solo-maintained SideStore fork whose primary goal is to fix the `-80045` authentication error on iOS 26.4+. Requests outside that goal are fine, but they wait behind it.
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: What is the feature? How would it work?
      placeholder: Please be clear and concise with your description.
    validations:
      required: true
  - type: textarea
    id: use-cases
    attributes:
      label: Use cases
      description: Please include multiple use cases where this feature would be useful.
    validations:
      required: true
  - type: textarea
    id: relates-to-goal
    attributes:
      label: Does this move the -80045 fix forward?
      description: If the request touches Apple ID sign-in, Anisette data, or GrandSlam, say how — those get looked at first.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: If you have alternative ideas of how this feature could work, you can put them here.
